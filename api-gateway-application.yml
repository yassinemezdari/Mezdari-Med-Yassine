server:
  port: 8080

spring:
  application:
    name: api-gateway
  
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
        
        - id: suivi-croissance-service
          uri: lb://suivi-croissance-service
          predicates:
            - Path=/api/suivi-croissance/**
        
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**,/api/admin/**,/api/doctor/**,/api/parent/**,/api/infirmier/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
